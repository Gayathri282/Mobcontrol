<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f2b20">
  <title>Mob Control - Fun Arcade Runner</title>
  
  <!-- Child-Friendly Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Master Game Container -->
  <div id="gameContainer">
    <!-- Game Canvases (3D WebGL + 2D Overlay) -->
    <canvas id="glCanvas"></canvas>
    <canvas id="c"></canvas>


    <!-- Title & Intro Overlay -->
    <div class="layer" id="title">
      <div class="card fade">
        <h1 class="wordmark"><span class="icon">🏃</span> Mob Control</h1>
        <p class="blurb">Guide your cute mob forward! Drag or tap left and right to steer through the best gates.</p>
        
        <div class="controls-hint">🎮 Keys: ◄ ► / A D · Touch: Drag to steer</div>

        <button class="btn" id="startBtn">Play Now! 🚀</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="layer hidden" id="over">
      <div class="card fade" id="overCard">
        <h2 id="overTitle">Great Try! 🎉</h2>
        <p class="result">Your Score</p>
        <p class="score" id="finalScore">0</p>
        <p class="meta" id="tierLine">0 m marched · peak 0 troops</p>
        <p class="meta last" id="bestLine">🏆 Best Record: 0</p>
        <button class="btn btn-yellow" id="againBtn">Play Again! 🔄</button>
      </div>
    </div>
  </div>

  <!-- Three.js 3D Engine & FBX Loader Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

  <!-- Game Logic Script -->
  <script src="game.js"></script>
</body>
</html>
